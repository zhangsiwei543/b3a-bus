<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>B3A 富泰邨 ⇄ 深圳灣口岸</title>
<style>
  :root{
    --bg:#0b1220;
    --card:#151f33;
    --card2:#1b2740;
    --fg:#eaf1ff;
    --muted:#8ea0c0;
    --accent:#4da3ff;
    --accent2:#7ee0c0;
    --warn:#ffb454;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    font-family:"Segoe UI","Microsoft JhengHei","PingFang HK",system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 800px at 20% 0%, #16233f 0%, var(--bg) 60%);
    color:var(--fg);
  }
  .wrap{width:100%;max-width:560px;}
  header{text-align:center;margin-bottom:18px;}
  .route-badge{
    display:inline-block;
    background:linear-gradient(135deg,var(--accent),#2f7fe0);
    color:#fff;font-weight:800;font-size:22px;
    padding:6px 18px;border-radius:12px;
    letter-spacing:1px;
    box-shadow:0 6px 20px rgba(77,163,255,.35);
  }
  h1{font-size:22px;margin:14px 0 4px;font-weight:700;}
  .sub{color:var(--muted);font-size:14px;line-height:1.6;}
  .sub b{color:var(--fg);font-weight:600;}

  .tabs{
    display:flex;gap:6px;margin-bottom:14px;
    background:var(--card);border:1px solid rgba(255,255,255,.06);
    border-radius:14px;padding:6px;
  }
  .tabs button{
    flex:1;appearance:none;border:0;background:transparent;
    color:var(--muted);font:inherit;font-weight:700;font-size:14px;
    padding:11px 8px;border-radius:10px;cursor:pointer;
    transition:background .18s ease,color .18s ease,box-shadow .18s ease;
    white-space:nowrap;
  }
  .tabs button:hover{color:var(--fg);}
  .tabs button[aria-selected="true"]{
    background:linear-gradient(135deg,var(--accent),#2f7fe0);
    color:#fff;box-shadow:0 4px 14px rgba(77,163,255,.35);
  }
  .stop-note{
    text-align:center;color:var(--muted);font-size:12.5px;
    margin:-4px 0 12px;
  }

  .cards{display:flex;flex-direction:column;gap:12px;}
  .card{
    background:var(--card);
    border:1px solid rgba(255,255,255,.06);
    border-radius:16px;
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .card.next{
    background:linear-gradient(135deg,#1b2b4d,#16233f);
    border-color:rgba(126,224,192,.35);
  }
  .mins{
    font-size:46px;font-weight:800;line-height:1;
    min-width:120px;text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .card.next .mins{color:var(--accent2);}
  .mins.arriving{font-size:26px;}
  .unit{font-size:14px;color:var(--muted);font-weight:600;}
  .meta{flex:1;min-width:0;}
  .eta-time{font-size:18px;font-weight:700;}
  .eta-time .ap{font-size:12px;color:var(--muted);margin-left:4px;}
  .dest{font-size:13px;color:var(--muted);margin-top:2px;}
  .tag{
    font-size:12px;font-weight:700;color:#0b1220;
    background:var(--accent2);border-radius:999px;padding:3px 10px;
    display:inline-block;margin-bottom:6px;
  }
  .empty,.error{
    text-align:center;padding:40px 20px;border-radius:16px;
    background:var(--card);border:1px solid rgba(255,255,255,.06);color:var(--muted);
  }
  .error{color:#ff9a9a;}
  footer{
    margin-top:22px;text-align:center;color:var(--muted);font-size:12.5px;
  }
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--accent2);margin-right:6px;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);
    border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;
    vertical-align:middle;margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="route-badge">B3A</span>
      <h1>富泰邨 ⇄ 深圳灣口岸</h1>
      <div class="sub">
        <b>Fu Tai Estate</b> ⇄ <b>Shenzhen Bay Port</b><br>
        城巴 Citybus · 資料來自 DATA.GOV.HK
      </div>
    </header>

    <div class="tabs" role="tablist" aria-label="方向">
      <button type="button" role="tab" data-dir="toPort" aria-selected="true">往深圳灣口岸</button>
      <button type="button" role="tab" data-dir="toFuTai" aria-selected="false">往富泰</button>
    </div>
    <div class="stop-note" id="stopNote">富泰邨 · 青山公路</div>

    <main class="cards" id="list" role="tabpanel">
      <div class="empty"><span class="spinner"></span>正在載入Next Bus資料…</div>
    </main>

    <footer>
      <span class="dot"></span>每 30 秒自動更新 · <span id="updated">—</span>
      · 下次更新 <span id="countdown">30</span>s
    </footer>
  </div>

<script>
(function(){
  // Citybus / DATA.GOV.HK real-time ETA API (per stop, split by direction)
  const API  = 'https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/CTB';
  const ROUTE = 'B3A';
  const REFRESH_MS = 30000;   // refresh every 30 seconds

  // Stop 003261 = 富泰邨 (outbound, bus toward the port)
  // Stop 003208 = 深圳灣口岸 (inbound, bus back toward Fu Tai / Shan King)
  const DIRS = {
    toPort:  { stop:'003261', dir:'O', note:'富泰邨 · 青山公路',
               dest:'往 Shenzhen Bay Port', empty:'暫未有下一班 B3A 往深圳灣口岸' },
    toFuTai: { stop:'003208', dir:'I', note:'深圳灣口岸',
               dest:'往 富泰 Fu Tai Estate', empty:'暫未有下一班 B3A 往富泰' }
  };

  const listEl  = document.getElementById('list');
  const updEl   = document.getElementById('updated');
  const countEl = document.getElementById('countdown');
  const noteEl  = document.getElementById('stopNote');

  // Per-direction state so one failing feed never blanks the other
  const state = {};
  Object.keys(DIRS).forEach(k => { state[k] = { buses:null, error:null, at:null }; });

  let active = location.hash === '#toFuTai' ? 'toFuTai' : 'toPort';

  function fmtClock(iso){
    const d = new Date(iso);
    let h = d.getHours(), m = d.getMinutes();
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h === 0) h = 12;
    return { t: h + ':' + String(m).padStart(2,'0'), ap };
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(){
    const cfg = DIRS[active];
    const s   = state[active];
    noteEl.textContent = cfg.note;

    if(s.error){
      listEl.innerHTML =
        '<div class="error">無法取得Next Bus資料<br>' +
        '<span style="font-size:12px">' + esc(s.error) + '</span><br>' +
        '<span style="font-size:12px">會於 30 秒後重試</span></div>';
      return;
    }

    if(!s.buses){
      listEl.innerHTML = '<div class="empty"><span class="spinner"></span>正在更新…</div>';
      return;
    }

    if(!s.buses.length){
      listEl.innerHTML =
        '<div class="empty">' + cfg.empty + '<br>' +
        '<span style="font-size:12px">No next bus available · 請稍後再試</span></div>';
      return;
    }

    const now = Date.now();
    listEl.innerHTML = s.buses.slice(0,3).map((b, i) => {
      const diff = Math.round((b.eta.getTime() - now) / 60000);
      const c = fmtClock(b.eta.toISOString());
      const big = diff <= 0 ? '即將到達' : (diff + ' <span class="unit">分鐘</span>');
      const bigCls = diff <= 0 ? 'mins arriving' : 'mins';
      const tag = i === 0 ? '<span class="tag">下一班 Next</span>' : '';
      const remark = b.remark ? '<div class="dest">' + esc(b.remark) + '</div>' : '';
      return '<div class="card' + (i === 0 ? ' next' : '') + '">' +
               '<div class="' + bigCls + '">' + big + '</div>' +
               '<div class="meta">' + tag +
                 '<div class="eta-time">' + c.t + '<span class="ap">' + c.ap + '</span></div>' +
                 '<div class="dest">' + cfg.dest + '</div>' +
                 remark +
               '</div>' +
             '</div>';
    }).join('');

    if(s.at){
      const g = fmtClock(s.at.toISOString());
      updEl.textContent = '更新於 ' + g.t + g.ap;
    }
  }

  async function fetchDir(key){
    const cfg = DIRS[key], s = state[key];
    try{
      const res = await fetch(API + '/' + cfg.stop + '/' + ROUTE, { cache:'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      const now = Date.now();

      let buses = (json.data || [])
        .filter(e => e.dir === cfg.dir)
        .map(e => ({ eta:new Date(e.eta), remark:(e.rmk_tc || e.rmk_en || '').trim() }))
        .sort((a,b) => a.eta - b.eta);

      // Drop buses that have already departed (more than ~30s in the past)
      buses = buses.filter(b => (b.eta.getTime() - now) > -30000);

      s.buses = buses;
      s.error = null;
      s.at = new Date();
    }catch(err){
      s.buses = null;
      s.error = err.message;
      s.at = new Date();
    }
  }

  async function load(){
    listEl.innerHTML = '<div class="empty"><span class="spinner"></span>正在更新…</div>';
    await Promise.all(Object.keys(DIRS).map(fetchDir));
    render();
    restartCountdown();
  }

  function setActive(key, updateUrl){
    active = key;
    document.querySelectorAll('.tabs button').forEach(b => {
      b.setAttribute('aria-selected', String(b.dataset.dir === key));
    });
    if(updateUrl){
      const url = location.pathname + location.search + (key === 'toFuTai' ? '#toFuTai' : '');
      history.replaceState(null, '', url);
    }
    render();
  }

  document.querySelectorAll('.tabs button').forEach(b => {
    b.addEventListener('click', () => setActive(b.dataset.dir, true));
  });

  // 30-second countdown display
  let timer = null;
  function restartCountdown(){
    let remain = REFRESH_MS / 1000;
    countEl.textContent = remain;
    if(timer) clearInterval(timer);
    timer = setInterval(() => {
      remain--;
      if(remain <= 0){ load(); }
      else { countEl.textContent = remain; }
    }, 1000);
  }

  setActive(active, false);
  load();
})();
</script>
</body>
</html>
